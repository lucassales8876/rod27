<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#17223b">
<title>Rod27 · Primeiro acesso</title>
<style>
:root{--n:#17223b;--p:#f5f2ec;--i:#182033;--m:#68707d;--l:#ded8cd;--g:#1f7a55;--r:#a53d3d}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:480px;margin:52px auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:24px;box-shadow:0 16px 50px #17223b10}
.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a6c3e;font-weight:900}.muted{color:var(--m)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 5px}
input{width:100%;padding:12px;border:1px solid #d2ccc2;border-radius:11px;font:inherit}.btn{margin-top:18px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}
.msg{min-height:22px;margin-top:10px;font-size:13px}.err{color:var(--r)}.ok{color:var(--g)}a{color:var(--n);font-weight:700}
</style></head><body>
<div class="wrap"><div class="card">
<div class="ey">ROD27 · PRIMEIRO ACESSO</div>
<h1>Crie sua senha</h1>
<p class="muted">Use o e-mail autorizado e o código temporário recebido. A senha será definida por você.</p>
<label>E-mail</label><input id="email" type="email" autocomplete="email">
<label>Código temporário</label><input id="code" autocomplete="one-time-code">
<label>Nova senha</label><input id="pw" type="password" autocomplete="new-password">
<label>Confirme a senha</label><input id="pw2" type="password" autocomplete="new-password">
<button type="button" data-password-ids="pw,pw2" aria-pressed="false" onclick="toggleSenha(this)" style="margin-top:8px;padding:6px 0;border:0;background:transparent;color:#273a62;font:inherit;font-size:13px;font-weight:700;cursor:pointer">Mostrar senha</button>
<button class="btn" onclick="go()">Criar acesso</button>
<div id="msg" class="msg"></div>
</div></div>
<script>
var U="https://zrjxxcytgtjuuinhkfux.supabase.co",K="sb_publishable_p6zUbFwkzvfv_7XUMqhxwA_BjGCxIEh";
function toggleSenha(btn){
 var fields=(btn.getAttribute("data-password-ids")||"").split(",").map(function(id){return document.getElementById(id)}).filter(Boolean);
 if(!fields.length)return;
 var reveal=fields[0].type==="password";
 fields.forEach(function(input){input.type=reveal?"text":"password"});
 btn.textContent=reveal?"Ocultar senha":"Mostrar senha";
 btn.setAttribute("aria-pressed",reveal?"true":"false");
}
async function go(){
  var m=document.getElementById("msg"),e=document.getElementById("email").value.trim(),
      c=document.getElementById("code").value.trim(),p=document.getElementById("pw").value,
      p2=document.getElementById("pw2").value;
  m.className="msg";m.textContent="Validando…";
  if(p!==p2){m.className="msg err";m.textContent="As senhas não coincidem.";return}
  if(p.length<12){m.className="msg err";m.textContent="Use uma senha com pelo menos 12 caracteres.";return}
  try{
    var r=await fetch(U+"/auth/v1/signup",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},
      body:JSON.stringify({email:e,password:p,data:{rod27_admin_setup:true,rod27_admin_invite:c}})});
    var j=await r.json();
    if(!r.ok)throw new Error(j.msg||j.message||j.error_description||"Não foi possível criar o acesso.");
    var login="index.html";
    m.className="msg ok";m.innerHTML="Acesso criado com sucesso. <a href='"+login+"'>Entrar agora</a>";
    ["code","pw","pw2"].forEach(function(id){document.getElementById(id).value=""});
  }catch(x){m.className="msg err";m.textContent=x.message}
}
</script></body></html>
