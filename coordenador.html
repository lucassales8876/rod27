<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#17223b">
<title>Rod27 · Coordenador</title>
<style>
:root{--n:#17223b;--n2:#273a62;--p:#f5f2ec;--i:#182033;--m:#68707d;--l:#e4ded3;--g:#1f7a55;--a:#9a6418;--r:#a53d3d;--gold:#b7873f}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:960px;margin:auto;min-height:100vh;padding-bottom:50px}
.hero{background:linear-gradient(145deg,var(--n),var(--n2));color:#fff;padding:28px 20px;border-radius:0 0 28px 28px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#dbc69d;font-weight:800}.hero h1{margin:5px 0}.hero p{margin:0;opacity:.85}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.badge{font-size:12px;padding:6px 9px;border-radius:99px;background:#ffffff17;border:1px solid #ffffff20}
main{padding:18px}.prog{background:#fff;border:1px solid var(--l);border-radius:17px;padding:13px;margin-bottom:12px}.bar{height:8px;background:#ece7de;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.chip{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:99px;padding:7px 10px}.chip.on{background:var(--n);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:12px;display:grid;grid-template-columns:58px 1fr auto;gap:11px;align-items:center}.card button{display:contents}.photo{width:58px;height:58px;border-radius:15px;object-fit:cover;background:#eee}.name{font-weight:800;line-height:1.25}.church{font-size:13px;color:var(--m);margin-top:2px}.state{font-size:10px;font-weight:900;text-transform:uppercase;border-radius:99px;padding:5px 7px}.new{background:#eef1f5}.draft{background:#fff1cf;color:var(--a)}.sent{background:#dff3e9;color:var(--g)}.special{background:#f2e8f7;color:#72438b}
.login{max-width:430px;margin:72px auto;background:#fff;border:1px solid var(--l);border-radius:24px;padding:25px}.login h2{margin:5px 0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;border:1px solid #d6d0c6;border-radius:11px;padding:12px}.muted{color:var(--m)}.error{color:var(--r);font-size:13px;min-height:20px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.primary{background:var(--n);color:#fff}.ghost{background:#eee9e1}.danger{background:var(--r);color:#fff}.small{font-size:12px;padding:7px 9px}
.back{position:fixed;inset:0;background:#0c12218a;display:none;align-items:flex-end;justify-content:center;z-index:30}.back.show{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:19px}.warn{background:#fff8e9;border-left:4px solid var(--gold);padding:11px;border-radius:10px;margin:13px 0}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:15px}.head{display:flex;gap:11px;align-items:center;padding-bottom:13px;border-bottom:1px solid var(--l)}.head img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#eee}.q{padding:14px 0;border-bottom:1px solid var(--l)}.qn{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:900}.q h3{margin:3px 0 5px;font-size:17px}.q p{margin:0 0 9px;color:#5f6673}textarea{width:100%;min-height:120px;border:1px solid #d8d2c8;border-radius:12px;padding:10px;resize:vertical}.op{display:flex;gap:8px;padding:9px;border:1px solid var(--l);border-radius:10px;margin:6px 0}.save{font-size:11px;color:var(--m);min-height:16px;margin-top:4px}.review{background:#f7f5f0;border:1px solid var(--l);border-radius:13px;padding:11px}.review p{white-space:pre-wrap;margin:4px 0 11px}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);background:var(--n);color:#fff;padding:9px 12px;border-radius:10px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:720px){.hero{margin-top:18px;border-radius:26px}.back{align-items:center}.modal{border-radius:24px}}
</style></head><body>
<div id="app" class="shell"></div><div id="back" class="back"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
var S={session:sessionStorage.getItem("rod27_session")||null,data:null,filter:"all",cur:null,form:null,timers:new Map()},app=document.getElementById("app"),back=document.getElementById("back"),box=document.getElementById("modal");
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[x]})}
function toast(m){var x=document.getElementById("toast");x.textContent=m;x.classList.add("show");setTimeout(function(){x.classList.remove("show")},2200)}
async function post(action,p,auth){var h={"Content-Type":"application/json"};if(auth!==false&&S.session)h["X-Rod27-Session"]=S.session;var r=await fetch("https://zrjxxcytgtjuuinhkfux.supabase.co/functions/v1/rod27-coordinator",{method:"POST",headers:h,body:JSON.stringify(Object.assign({action:action},p||{}))});var j=await r.json().catch(function(){return{ok:false,error:"Resposta inválida."}});if(!r.ok||!j.ok)throw new Error(j.error||"Falha na comunicação.");return j}
function loginView(msg){app.innerHTML='<div class="login"><div class="ey">ROD27 · COORDENADOR</div><h2>Entrar no seu setor</h2><p class="muted">Use seu ROL de coordenador e a senha fornecida pela Secretaria.</p><div class="field"><label>ROL</label><input id="rol" inputmode="numeric" autocomplete="username" placeholder="Seu ROL"></div><div class="field"><label>Senha de acesso</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••"></div><div id="err" class="error">'+e(msg||"")+'</div><button class="btn primary" style="width:100%" onclick="login()">Entrar</button></div>'}
window.login=async function(){var rol=document.getElementById("rol").value.trim(),senha=document.getElementById("pin").value.trim(),err=document.getElementById("err");err.textContent="Entrando…";try{var d=await post("login",{rol:rol,senha:senha},false);S.session=d.session_token;sessionStorage.setItem("rod27_session",S.session);await boot()}catch(x){err.textContent=x.message}}
window.logout=async function(){try{if(S.session)await post("logout")}catch(x){}S.session=null;sessionStorage.removeItem("rod27_session");loginView()}
function tag(c){if(c.eh_proprio_coordenador)return["Coordenação","special"];if(c.status==="enviada")return["Enviada","sent"];if(c.status==="em_preenchimento")return["Em andamento","draft"];return["Avaliar","new"]}
function filt(k,l){return'<button class="chip '+(S.filter===k?"on":"")+'" onclick="setF(&quot;'+k+'&quot;)">'+l+'</button>'}
function card(c){var t=tag(c);return'<div class="card"><button onclick="openC(&quot;'+c.id+'&quot;)"><img class="photo" src="'+e(c.dirigente_foto_url_snapshot||"")+'" alt="" onerror="this.style.visibility=&quot;hidden&quot;"><div><div class="name">'+e(c.dirigente_nome_snapshot)+'</div><div class="church">'+e(c.congregacao_nome_snapshot)+'</div></div><span class="state '+t[1]+'">'+t[0]+'</span></button></div>'}
function render(){var d=S.data,u=d.progress.total-d.progress.tratamento_especial,p=u?Math.round(d.progress.enviadas/u*100):0,rows=d.cards.filter(function(c){return S.filter==="all"||c.status===S.filter||(S.filter==="special"&&c.eh_proprio_coordenador)});app.innerHTML='<section class="hero"><div class="top"><div><div class="ey">Rodízio 2027 · Área '+e(d.coordinator.area)+'</div><h1>Setor '+d.coordinator.setor+'</h1><p>'+e(d.coordinator.nome)+' · ROL '+e(d.coordinator.rol)+'</p></div><button class="btn ghost small" onclick="logout()">Sair</button></div><div class="badges"><span class="badge">'+d.progress.total+' dirigentes</span><span class="badge">'+d.progress.enviadas+' enviados</span><span class="badge">'+d.progress.em_preenchimento+' em andamento</span></div></section><main><div class="prog"><strong>Progresso</strong><span style="float:right">'+d.progress.enviadas+'/'+u+'</span><div class="bar"><i style="width:'+p+'%"></i></div></div><div class="filters">'+filt("all","Todos")+filt("nao_iniciada","Não iniciadas")+filt("em_preenchimento","Em andamento")+filt("enviada","Enviadas")+filt("special","Coordenação")+'</div><div class="grid">'+(rows.map(card).join("")||'<span class="muted">Nenhum dirigente neste filtro.</span>')+'</div></main>'}
window.setF=function(k){S.filter=k;render()};
function closeM(){back.classList.remove("show");box.innerHTML=""}window.closeM=closeM;back.addEventListener("click",function(x){if(x.target===back)closeM()});
window.openC=async function(id){var c=S.data.cards.find(function(x){return x.id===id});if(c.eh_proprio_coordenador){box.innerHTML='<h2>'+e(c.dirigente_nome_snapshot)+'</h2><p>'+e(c.congregacao_nome_snapshot)+'</p><div class="warn"><strong>Ficha da coordenação</strong><br>A avaliação do próprio coordenador será tratada separadamente pela Secretaria.</div><div class="actions"><button class="btn primary" onclick="closeM()">Entendi</button></div>';back.classList.add("show");return}if(c.status==="nao_iniciada"){try{var f=await post("form",{avaliacao_id:id});S.form=f;S.cur=c;box.innerHTML='<h2>'+e(f.config.titulo_aviso)+'</h2><div class="warn">'+e(f.config.texto_aviso)+'</div><p class="muted">Você pode salvar e continuar depois. O bloqueio definitivo ocorre apenas no envio.</p><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="startE()">Entendi, iniciar</button></div>';back.classList.add("show")}catch(x){toast(x.message)}}else loadF(id)};
window.startE=async function(){try{await post("confirm_notice",{avaliacao_id:S.cur.id});await loadF(S.cur.id,true)}catch(x){toast(x.message)}};
async function loadF(id,keep){try{var f=await post("form",{avaliacao_id:id});S.form=f;S.cur=S.data.cards.find(function(x){return x.id===id});var ans=new Map((f.answers||[]).map(function(a){return[a.pergunta_id,a.resposta_texto!=null?a.resposta_texto:(a.resposta_opcao||"")]})),h='<div class="head"><img src="'+e(f.evaluation.dirigente_foto_url_snapshot||"")+'" alt=""><div><div class="ey">Avaliação do dirigente</div><h2 style="margin:2px 0">'+e(f.evaluation.dirigente_nome_snapshot)+'</h2><div class="church">'+e(f.evaluation.congregacao_nome_snapshot)+'</div></div></div>';if(f.evaluation.status==="enviada")h+='<div class="warn"><strong>Avaliação enviada.</strong> Somente leitura.</div>';h+=(f.questions||[]).map(function(q,i){return qHtml(q,i,ans.get(q.id)||"",f.evaluation.status==="enviada")}).join("");h+='<div class="actions"><button class="btn ghost" onclick="closeM()">Fechar</button>'+(f.evaluation.status!=="enviada"?'<button class="btn primary" onclick="reviewE()">Revisar e enviar</button>':"")+'</div>';box.innerHTML=h;back.classList.add("show")}catch(x){toast(x.message);if(!keep)closeM()}}window.loadF=loadF;
function qHtml(q,i,v,ro){var x="";if(q.tipo_resposta==="escolha_unica")x=(q.opcoes||[]).map(function(o){return'<label class="op"><input type="radio" name="q_'+q.id+'" value="'+e(o)+'" '+(v===o?"checked":"")+' '+(ro?"disabled":"")+' onchange="queue(&quot;'+q.codigo+'&quot;,this.value,&quot;'+q.id+'&quot;)"><span>'+e(o)+'</span></label>'}).join("");else x='<textarea '+(ro?"disabled":"")+' data-qid="'+q.id+'" oninput="queue(&quot;'+q.codigo+'&quot;,this.value,&quot;'+q.id+'&quot;)">'+e(v)+'</textarea>';return'<section class="q"><div class="qn">Pergunta '+(i+1)+' · '+e(q.categoria)+'</div><h3>'+e(q.titulo)+'</h3><p>'+e(q.enunciado)+'</p>'+x+'<div id="s_'+q.id+'" class="save"></div></section>'}
window.queue=function(c,v,id){var l=document.getElementById("s_"+id);if(l)l.textContent="Alteração pendente…";clearTimeout(S.timers.get(id));S.timers.set(id,setTimeout(function(){save(c,v,id)},700))};
async function save(c,v,id){if(!String(v).trim())return;var l=document.getElementById("s_"+id);if(l)l.textContent="Salvando…";try{await post("save_answer",{avaliacao_id:S.cur.id,codigo:c,resposta:v});if(l)l.textContent="Salvo";var x=S.data.cards.find(function(y){return y.id===S.cur.id});if(x&&x.status==="nao_iniciada"){x.status="em_preenchimento";S.data.progress.nao_iniciadas--;S.data.progress.em_preenchimento++}}catch(z){if(l)l.textContent="Não salvo";toast(z.message)}}
window.reviewE=async function(){S.timers.forEach(clearTimeout);S.timers.clear();var ta=Array.from(box.querySelectorAll("textarea[data-qid]"));for(var i=0;i<ta.length;i++){var el=ta[i],q=S.form.questions.find(function(x){return x.id===el.dataset.qid});if(el.value.trim())await save(q.codigo,el.value,q.id)}var f=await post("form",{avaliacao_id:S.cur.id}),m=new Map((f.answers||[]).map(function(a){return[a.pergunta_id,a.resposta_texto!=null?a.resposta_texto:(a.resposta_opcao||"")]})),miss=f.questions.filter(function(q){return q.obrigatoria&&!String(m.get(q.id)||"").trim()});if(miss.length){toast("Ainda há "+miss.length+" pergunta(s) sem resposta.");return}box.innerHTML='<h2>Revise antes de enviar</h2><div class="warn"><strong>Última conferência.</strong> Depois do envio não será possível alterar.</div><div class="review">'+f.questions.map(function(q){return'<b>'+e(q.titulo)+'</b><p>'+e(m.get(q.id)||"")+'</p>'}).join("")+'</div><div class="actions"><button class="btn ghost" onclick="loadF(&quot;'+S.cur.id+'&quot;,true)">Voltar e editar</button><button class="btn danger" onclick="submitE()">Enviar definitivamente</button></div>'};
window.submitE=async function(){try{await post("submit",{avaliacao_id:S.cur.id});closeM();toast("Avaliação enviada.");await boot()}catch(x){toast(x.message)}};
async function boot(){if(!S.session){loginView();return}try{S.data=await post("bootstrap");render()}catch(x){S.session=null;sessionStorage.removeItem("rod27_session");loginView(x.message)}}
boot();
</script></body></html>
