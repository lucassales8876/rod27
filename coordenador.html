var S={session:sessionStorage.getItem("rod27_session")||null,data:null,filter:"all",cur:null,form:null,timers:new Map(),saveChains:new Map(),failedSaves:new Set()},app=document.getElementById("app"),back=document.getElementById("back"),box=document.getElementById("modal");
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[x]})}

function toggleSenha(btn){
 var fields=(btn.getAttribute("data-password-ids")||"").split(",").map(function(id){return document.getElementById(id)}).filter(Boolean);
 if(!fields.length)return;

}

function manifestationPanel(){var m=S.data.manifestation,a=S.data.coordinator_assignment,status=!m?"Aguardando preenchimento":m.status==="enviada"?"Enviada":"Rascunho salvo";var h='<section class="prog"><div class="top"><div><div class="ey">Rodízio 2027</div><h2 style="margin:3px 0">Manifestação de Interesse</h2></div><span class="state '+(m&&m.status==="enviada"?"sent":m?"draft":"new")+'">'+e(status)+'</span></div><p><strong>'+e(a.coordenador_nome)+'</strong> · ROL '+e(a.coordenador_rol)+'<br>Setor '+e(a.setor_numero)+' · '+e(a.congregacao_nome)+'</p>';if(m&&m.status==="enviada"){h+='<p><strong>Resposta:</strong> '+(m.deseja_permanecer?"Sim — "+e(manifestationOptionLabel(m.opcao_movimentacao)):"Não")+(m.justificativa?'<br><strong>Justificativa:</strong> '+e(m.justificativa):"")+'</p>'}h+='<div class="actions"><button class="btn primary small" onclick="openManifest()">'+(m&&m.status==="enviada"?"Ver manifestação":"Preencher manifestação")+'</button><button class="btn ghost small" onclick="printBlankManifestation()">Imprimir formulário em branco</button></div></section>';return h}
function render(){var d=S.data,u=d.progress.total,p=u?Math.round(d.progress.enviadas/u*100):0,rows=d.cards.filter(function(c){return S.filter==="all"||c.status===S.filter});app.innerHTML='<section class="hero"><div class="top"><div><div class="ey">Rodízio 2027 · Área '+e(d.coordinator.area)+'</div><h1>Setor '+d.coordinator.setor+'</h1><p>'+e(d.coordinator.nome)+' · ROL '+e(d.coordinator.rol)+'</p></div><button class="btn ghost small" onclick="logout()">Sair</button></div><div class="badges"><span class="badge">'+d.progress.total+' dirigentes</span><span class="badge">'+d.progress.enviadas+' enviados</span><span class="badge">'+d.progress.em_preenchimento+' em andamento</span></div></section><main>'+manifestationPanel()+'<div class="prog"><strong>Progresso das avaliações dos demais dirigentes</strong><span style="float:right">'+d.progress.enviadas+'/'+u+'</span><div class="bar"><i style="width:'+p+'%"></i></div></div><div class="filters">'+filt("all","Todos")+filt("nao_iniciada","Não iniciadas")+filt("em_preenchimento","Em andamento")+filt("enviada","Enviadas")+'</div><div class="grid">'+(rows.map(card).join("")||'<span class="muted">Nenhum dirigente neste filtro.</span>')+'</div></main>'}

window.openManifest=function(){var m=S.data.manifestation,a=S.data.coordinator_assignment,h='<div class="ey">RODÍZIO 2027</div><h2>Manifestação de Interesse para o Próximo Rodízio</h2><p class="muted">'+e(a.coordenador_nome)+' · ROL '+e(a.coordenador_rol)+'<br>Setor '+e(a.setor_numero)+' · '+e(a.congregacao_nome)+'</p>';if(m&&m.status==="enviada"){h+='<div class="warn"><strong>Manifestação enviada.</strong> As respostas foram registradas separadamente das avaliações.</div>'+manifestationSummary(m)+'<div class="actions"><button class="btn primary" onclick="closeM()">Fechar</button></div>';box.innerHTML=h;back.classList.add("show");return}h+='<section class="q"><h3>Deseja permanecer no rodízio do próximo ano?</h3><label class="op"><input type="radio" name="manifest-choice" value="yes" '+(m&&m.deseja_permanecer===true?"checked":"")+' onchange="manifestToggle()"><span>Sim</span></label><label class="op"><input type="radio" name="manifest-choice" value="no" '+(m&&m.deseja_permanecer===false?"checked":"")+' onchange="manifestToggle()"><span>Não</span></label></section><section id="manifestMoves" class="q" hidden><h3>Se deseja permanecer, qual opção prefere?</h3>'+manifestOptionHtml("mesma_congregacao","Permanecer na mesma congregação",m&&m.opcao_movimentacao==="mesma_congregacao")+manifestOptionHtml("outra_congregacao_mesmo_setor","Mudar para outra congregação do mesmo setor",m&&m.opcao_movimentacao==="outra_congregacao_mesmo_setor")+manifestOptionHtml("congregacao_outro_setor","Mudar para uma congregação de outro setor",m&&m.opcao_movimentacao==="congregacao_outro_setor")+'</section><section id="manifestReason" class="q" hidden><h3>Motivo da sua preferência</h3><p>Explique sua preferência ao pastor. Para mudança ou saída, a justificativa é obrigatória.</p><textarea id="manifestJustification" maxlength="4000" placeholder="Justificativa obrigatória">'+e(m&&m.justificativa||"")+'</textarea></section><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn ghost" onclick="saveManifest(false)">Salvar rascunho</button><button class="btn primary" onclick="saveManifest(true)">Enviar manifestação</button></div>';box.innerHTML=h;back.classList.add("show");manifestToggle()};
window.manifestToggle=function(){var choice=document.querySelector('input[name="manifest-choice"]:checked'),yes=choice&&choice.value==="yes",no=choice&&choice.value==="no",moves=document.getElementById("manifestMoves"),reason=document.getElementById("manifestReason"),just=document.getElementById("manifestJustification");if(!moves)return;moves.hidden=!yes;reason.hidden=!(yes||no);Array.from(document.querySelectorAll('input[name="manifest-option"]')).forEach(function(x){x.required=!!yes;x.disabled=!yes});if(just){just.required=!!no||!!(yes&&document.querySelector('input[name="manifest-option"]:checked')?.value!=="mesma_congregacao");just.disabled=!(yes||no)}};
window.saveManifest=async function(submit){var choice=document.querySelector('input[name="manifest-choice"]:checked'),option=document.querySelector('input[name="manifest-option"]:checked'),just=document.getElementById("manifestJustification"),payload={deseja_permanecer:choice?choice.value==="yes":null,opcao_movimentacao:option?option.value:null,justificativa:just?just.value:null};if(submit&&!choice){toast("Responda se deseja permanecer.");return}if(submit&&choice.value==="yes"&&!option){toast("Selecione uma das opções de permanência ou mudança.");return}if(submit&&(choice.value==="no"||(choice.value==="yes"&&option&&option.value!=="mesma_congregacao"))&&(!just||!just.value.trim())){toast("Explique o motivo da mudança ou saída.");return}try{var r=await post(submit?"submit_manifestation":"save_manifestation",payload);S.data.manifestation=r.manifestation;toast(submit?"Manifestação enviada.":"Rascunho salvo.");if(submit){closeM();render()} }catch(x){toast(x.message)}};
window.printBlankManifestation=function(){var w=window.open("","_blank");if(!w){toast("Permita a abertura da janela de impressão.");return}var doc='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Manifestação de Interesse · Rodízio 2027</title><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font:12pt/1.45 Arial,sans-serif;color:#111;margin:0}h1{text-align:center;font-size:17pt;margin:0 0 4mm}.sub{text-align:center;margin:0 0 9mm;font-size:11pt}.field{margin:5mm 0}.line{display:inline-block;border-bottom:1px solid #111;min-width:90mm;height:7mm}.short{min-width:40mm}.question{font-weight:bold;margin:8mm 0 3mm}.choice{margin:3mm 0}.circle{display:inline-block;border:1px solid #111;border-radius:50%;width:4mm;height:4mm;margin-right:2mm;vertical-align:middle}.indent{margin-left:8mm}.rule{border-bottom:1px solid #555;height:9mm}.sign{margin-top:17mm;display:flex;gap:14mm}.sign div{flex:1;border-top:1px solid #111;text-align:center;padding-top:2mm}.footer{margin-top:8mm;font-size:10pt}</style></head><body><h1>Manifestação de Interesse<br>para o Próximo Rodízio — 2027</h1><p class="sub">Secretaria Geral da IEADERN</p><div class="field"><b>Nome:</b> <span class="line"></span></div><div class="field"><b>ROL:</b> <span class="line short"></span> <b>Setor:</b> <span class="line short"></span></div><div class="field"><b>Congregação atual:</b> <span class="line"></span></div><div class="question">Deseja permanecer no rodízio do próximo ano?</div><div class="choice"><span class="circle"></span> Sim</div><div class="choice"><span class="circle"></span> Não</div><div class="question">Se respondeu Sim, indique sua preferência:</div><div class="choice indent"><span class="circle"></span> Permanecer na mesma congregação</div><div class="choice indent"><span class="circle"></span> Mudar para outra congregação do mesmo setor</div><div class="choice indent"><span class="circle"></span> Mudar para uma congregação de outro setor</div><div class="question">Se respondeu Não, justifique:</div><div class="rule"></div><div class="rule"></div><div class="rule"></div><div class="sign"><div>Data</div><div>Assinatura</div></div></body></html>';w.document.open();w.document.write(doc);w.document.close();w.focus();setTimeout(function(){w.print()},300)};window.setF=function(k){S.filter=k;render()};
async function closeM(){if(S.timers.size||S.saveChains.size){if(!await flushPending(S.cur&&S.cur.id)){toast("Existem respostas não salvas. Corrija antes de fechar.");return}}back.classList.remove("show");box.innerHTML=""}window.closeM=closeM;back.addEventListener("click",function(x){if(x.target===back)closeM()});
window.openC=async function(id){var c=S.data.cards.find(function(x){return x.id===id});if(c.eh_proprio_coordenador&&!S.data.can_self_evaluate){box.innerHTML='<h2>'+e(c.dirigente_nome_snapshot)+'</h2><p>'+e(c.congregacao_nome_snapshot)+'</p><div class="warn"><strong>Ficha da coordenação</strong><br>A avaliação do próprio coordenador será tratada separadamente pela Secretaria.</div><div class="actions"><button class="btn primary" onclick="closeM()">Entendi</button></div>';back.classList.add("show");return}if(c.status==="nao_iniciada"){try{var f=await post("form",{avaliacao_id:id});S.form=f;S.cur=c;box.innerHTML='<h2>'+e(f.config.titulo_aviso)+'</h2><div class="warn">'+e(f.config.texto_aviso)+'</div><p class="muted">Você pode salvar e continuar depois. O bloqueio definitivo ocorre apenas no envio.</p><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="startE()">Entendi, iniciar</button></div>';back.classList.add("show")}catch(x){toast(x.message)}}else loadF(id)};
window.startE=async function(){try{await post("confirm_notice",{avaliacao_id:S.cur.id});await loadF(S.cur.id,true)}catch(x){toast(x.message)}};
async function loadF(id,keep){try{var f=await post("form",{avaliacao_id:id});S.form=f;S.cur=S.data.cards.find(function(x){return x.id===id});var ans=new Map((f.answers||[]).map(function(a){return[a.pergunta_id,a.resposta_texto!=null?a.resposta_texto:(a.resposta_opcao||"")]})),h='<div class="head"><img src="'+e(f.evaluation.dirigente_foto_url_snapshot||"")+'" alt=""><div><div class="ey">Avaliação do dirigente</div><h2 style="margin:2px 0">'+e(f.evaluation.dirigente_nome_snapshot)+'</h2><div class="church">'+e(f.evaluation.congregacao_nome_snapshot)+'</div></div></div>';if(f.evaluation.status==="enviada")h+='<div class="warn"><strong>Avaliação enviada.</strong> Somente leitura.</div>';h+=(f.questions||[]).map(function(q,i){return qHtml(q,i,ans.get(q.id)||"",f.evaluation.status==="enviada")}).join("");h+='<div class="actions"><button class="btn ghost" onclick="closeM()">Fechar</button>'+(f.evaluation.status!=="enviada"?'<button class="btn primary" onclick="reviewE()">Revisar e enviar</button>':"")+'</div>';box.innerHTML=h;back.classList.add("show")}catch(x){toast(x.message);if(!keep)closeM()}}window.loadF=loadF;
function qHtml(q,i,v,ro){var x="";if(q.tipo_resposta==="escolha_unica")x=(q.opcoes||[]).map(function(o){return'<label class="op"><input type="radio" name="q_'+q.id+'" value="'+e(o)+'" '+(v===o?"checked":"")+' '+(ro?"disabled":"")+' onchange="queue(&quot;'+q.codigo+'&quot;,this.value,&quot;'+q.id+'&quot;)"><span>'+e(o)+'</span></label>'}).join("");else x='<textarea '+(ro?"disabled":"")+' data-qid="'+q.id+'" oninput="queue(&quot;'+q.codigo+'&quot;,this.value,&quot;'+q.id+'&quot;)">'+e(v)+'</textarea>';return'<section class="q"><div class="qn">Pergunta '+(i+1)+' · '+e(q.categoria)+'</div><h3>'+e(q.titulo)+'</h3><p>'+e(q.enunciado)+'</p>'+x+'<div id="s_'+q.id+'" class="save"></div></section>'}
window.queue=function(c,v,id){
  var evalId=S.cur&&S.cur.id;
  if(!evalId)return;
  var l=document.getElementById("s_"+id);if(l)l.textContent="Alteração pendente…";
  var previous=S.timers.get(id);if(previous)clearTimeout(previous.timer);
  var pending={evalId:evalId,c:c,v:v,id:id};
  pending.timer=setTimeout(function(){
    if(S.timers.get(id)===pending)S.timers.delete(id);
    save(pending.evalId,pending.c,pending.v,pending.id);
  },700);
  S.timers.set(id,pending);
};
function save(evalId,c,v,id){
  if(!String(v).trim())return Promise.resolve(false);
  var key=evalId+":"+id,prev=S.saveChains.get(key)||Promise.resolve();
  var job=prev.then(async function(){
    var current=S.cur&&S.cur.id===evalId;
    var l=current?document.getElementById("s_"+id):null;
    if(l)l.textContent="Salvando…";
    try{
      await post("save_answer",{avaliacao_id:evalId,codigo:c,resposta:v});
      S.failedSaves.delete(key);
      if(l)l.textContent="Salvo";
      var x=S.data&&S.data.cards.find(function(y){return y.id===evalId});
      if(x&&x.status==="nao_iniciada"){
        x.status="em_preenchimento";
        S.data.progress.nao_iniciadas--;
        S.data.progress.em_preenchimento++;
      }
      return true;
    }catch(z){
      S.failedSaves.add(key);
      if(l)l.textContent="Não salvo";
      toast(z.message);return false;
    }
  });
  S.saveChains.set(key,job);
  job.then(function(){if(S.saveChains.get(key)===job)S.saveChains.delete(key)});
  return job;
}
async function flushPending(evalId){
  var pending=Array.from(S.timers.values());
  S.timers.clear();
  pending.forEach(function(x){clearTimeout(x.timer)});
  var jobs=pending.map(function(x){return save(x.evalId,x.c,x.v,x.id)});
  jobs=jobs.concat(Array.from(S.saveChains.values()));
  var results=await Promise.all(jobs);
  return results.every(Boolean)&&!Array.from(S.failedSaves).some(function(k){return k.startsWith(evalId+":")});
}
window.reviewE=async function(){
  if(!S.cur)return;
  var evalId=S.cur.id;
  try{
    if(!await flushPending(evalId)){toast("Há respostas não salvas. Verifique antes de revisar.");return}
    var f=await post("form",{avaliacao_id:evalId});
    if(!S.cur||S.cur.id!==evalId)return;
    var m=new Map((f.answers||[]).map(function(a){return[a.pergunta_id,a.resposta_texto!=null?a.resposta_texto:(a.resposta_opcao||"")]})),
        miss=f.questions.filter(function(q){return q.obrigatoria&&!String(m.get(q.id)||"").trim()});
    if(miss.length){toast("Ainda há "+miss.length+" pergunta(s) sem resposta.");return}
    box.innerHTML='<h2>Revise antes de enviar</h2><div class="warn"><strong>Última conferência.</strong> Depois do envio não será possível alterar.</div><div class="review">'+f.questions.map(function(q){return'<b>'+e(q.titulo)+'</b><p>'+e(m.get(q.id)||"")+'</p>'}).join("")+'</div><div class="actions"><button class="btn ghost" onclick="loadF(&quot;'+evalId+'&quot;,true)">Voltar e editar</button><button class="btn danger" onclick="submitE()">Enviar definitivamente</button></div>';
  }catch(x){toast(x.message)}
};
window.submitE=async function(){try{await post("submit",{avaliacao_id:S.cur.id});closeM();toast("Avaliação enviada.");await boot()}catch(x){toast(x.message)}};
async function boot(){if(!S.session){loginView();return}try{S.data=await post("bootstrap");render()}catch(x){S.session=null;sessionStorage.removeItem("rod27_session");loginView(x.message)}}
boot();
</script></body></html>
