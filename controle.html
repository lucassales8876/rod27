<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#111827">
<title>Rod27 · Central de Controle</title>
<style>
:root{--bg:#f4f1ea;--ink:#182033;--muted:#69707c;--line:#e3ddd2;--dark:#111827;--dark2:#24314d;--green:#1f7a55;--amber:#9a6418;--red:#a53d3d;--purple:#654a8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding-bottom:50px}.hero{background:linear-gradient(145deg,var(--dark),var(--dark2));color:#fff;padding:27px 20px;border-radius:0 0 26px 26px}.ey{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#cfc0e6;font-weight:900}.hero h1{margin:4px 0}.hero p{margin:0;opacity:.8}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
main{padding:18px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.tab.on{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.card h3{margin:0 0 9px}.kpi strong{font-size:25px;display:block}.kpi span{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800}.primary{background:var(--dark);color:#fff}.ghost{background:#ece8e1}.danger{background:#f4dddd;color:var(--red)}.small{font-size:12px;padding:7px 9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.login{max-width:430px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5cfc5;border-radius:10px;padding:10px}.error{color:var(--red);min-height:20px;font-size:13px}
.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.question{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0}.question h4{margin:0}.pill{display:inline-block;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:900;text-transform:uppercase;background:#eee}.ok{background:#dff3e9;color:var(--green)}.warn{background:#fff1cf;color:var(--amber)}.audit{font-size:12px;border-left:3px solid #d7d0c5;padding:6px 10px;margin:7px 0;background:#fff}.code{font-family:ui-monospace,monospace;background:#f5f3ef;padding:2px 5px;border-radius:5px}
.back{position:fixed;inset:0;background:#0b10208c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.back.show{display:flex}.modal{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:9px 12px;border-radius:10px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:720px){.hero{margin-top:18px;border-radius:25px}.shell{padding-left:8px;padding-right:8px}}
</style></head><body>
<div id="app" class="shell"></div><div id="back" class="back"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
var U="https://zrjxxcytgtjuuinhkfux.supabase.co",K="sb_publishable_p6zUbFwkzvfv_7XUMqhxwA_BjGCxIEh",S={a:null,r:null,data:null,tab:"overview"},app=document.getElementById("app"),back=document.getElementById("back"),box=document.getElementById("modal");
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[x]})}function toast(m){var x=document.getElementById("toast");x.textContent=m;x.classList.add("show");setTimeout(function(){x.classList.remove("show")},2200)}
function ss(d){S.a=d.access_token;S.r=d.refresh_token;sessionStorage.setItem("ctl_a",S.a||"");sessionStorage.setItem("ctl_r",S.r||"")}function clr(){S.a=null;S.r=null;sessionStorage.removeItem("ctl_a");sessionStorage.removeItem("ctl_r")}
async function rf(){if(!S.r)return false;var x=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.r})});if(!x.ok){clr();return false}ss(await x.json());return true}
async function api(action,p,retry){var x=await fetch("https://zrjxxcytgtjuuinhkfux.supabase.co/functions/v1/rod27-control",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.a},body:JSON.stringify(Object.assign({action:action},p||{}))});if(x.status===401&&!retry&&await rf())return api(action,p,true);var j=await x.json().catch(function(){return{ok:false,error:"Resposta inválida."}});if(!x.ok||!j.ok)throw new Error(j.error||"Falha.");return j}
function login(msg){app.innerHTML='<div class="login"><div class="ey">ROD27 · CONTROLE</div><h2>Superadministração</h2><p class="muted">Área de controle do sistema. Não é o painel operacional do Rodízio.</p><div class="field"><label>E-mail</label><input id="em" type="email"></div><div class="field"><label>Senha</label><input id="pw" type="password"></div><div id="er" class="error">'+e(msg||"")+'</div><button class="btn primary" style="width:100%" onclick="doLogin()">Entrar</button></div>'}
window.doLogin=async function(){var er=document.getElementById("er");er.textContent="Entrando…";try{var x=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":K,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value})}),j=await x.json();if(!x.ok)throw new Error("E-mail ou senha inválidos.");ss(j);await boot()}catch(z){er.textContent=z.message}}
window.logout=function(){clr();login()};function closeM(){back.classList.remove("show");box.innerHTML=""}window.closeM=closeM;back.addEventListener("click",function(x){if(x.target===back)closeM()});
function tabs(){return'<div class="tabs">'+[["overview","Visão geral"],["questions","Formulário"],["settings","Configurações"],["admins","Contas"],["audit","Auditoria"]].map(function(t){return'<button class="tab '+(S.tab===t[0]?"on":"")+'" onclick="setTab(&quot;'+t[0]+'&quot;)">'+t[1]+'</button>'}).join("")+'</div>'}
window.setTab=function(t){S.tab=t;render()};
function render(){var d=S.data;app.innerHTML='<section class="hero"><div class="top"><div><div class="ey">ROD27 · CENTRAL DE CONTROLE</div><h1>Controle do sistema</h1><p>'+e(d.admin.nome_exibicao||d.admin.email)+' · superadmin</p></div><div class="actions"><button class="btn ghost small" onclick="window.open(&quot;'+U+'/functions/v1/rod27-admin&quot;,&quot;_blank&quot;)">Abrir painel do Rodízio</button><button class="btn ghost small" onclick="logout()">Sair</button></div></div></section><main>'+tabs()+'<div id="view">'+view()+'</div></main>'}
function view(){var d=S.data;if(S.tab==="overview")return overview(d);if(S.tab==="questions")return questions(d);if(S.tab==="settings")return settings(d);if(S.tab==="admins")return admins(d);return audit(d)}
function overview(d){var h=d.health,g=(d.readiness&&d.readiness.checks)||[];
var pre='<div class="card" style="margin-bottom:12px"><h3>Preparação do Rodízio 2027</h3><p class="muted">Verificações automáticas do sistema; não liberam acessos nem publicam formulários.</p>'+g.map(function(x){return'<div class="row" style="display:flex;gap:12px;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e3ddd2"><div><b>'+e(x.title)+'</b><div class="muted">'+e(x.detail)+'</div></div><span class="pill '+(x.ok?"ok":"warn")+'">'+(x.ok?"Pronto":"Pendente")+'</span></div>'}).join("")+'</div>';return pre+'<div class="grid"><div class="card kpi"><strong>'+e(h.database_size)+'</strong><span>Banco de dados</span></div><div class="card kpi"><strong>'+h.setores+'</strong><span>Setores</span></div><div class="card kpi"><strong>'+h.avaliacoes+'</strong><span>Avaliações</span></div><div class="card kpi"><strong>'+h.credenciais_ativas+'</strong><span>Coordenadores ativos</span></div><div class="card kpi"><strong>'+h.sessoes_ativas+'</strong><span>Sessões ativas</span></div><div class="card kpi"><strong>'+h.admins+'</strong><span>Contas administrativas</span></div></div><div class="card" style="margin-top:12px"><h3>Estado operacional</h3><p>Edge do coordenador: <span class="pill ok">publicada</span> · Painel Secretaria: <span class="pill ok">publicado</span></p><p class="muted">O diagnóstico desta tela é gerado diretamente do banco institucional Rod27.</p><div class="actions"><button class="btn danger" onclick="revokeAll()">Encerrar todas as sessões de coordenadores</button></div></div>'}
function questions(d){return'<div class="card"><h3>Formulário do coordenador</h3><p class="muted">As perguntas ainda estão em rascunho e podem ser lapidadas antes da publicação.</p></div>'+d.questions.map(function(q){return'<div class="question"><span class="pill '+(q.status==="rascunho"?"warn":"ok")+'">'+e(q.status)+'</span><h4>'+q.ordem+'. '+e(q.titulo)+'</h4><p>'+e(q.enunciado)+'</p><button class="btn ghost small" onclick="editQ(&quot;'+q.id+'&quot;)">Editar</button></div>'}).join("")}
window.editQ=function(id){var q=S.data.questions.find(function(x){return x.id===id});box.innerHTML='<div class="ey">PERGUNTA '+q.ordem+'</div><h2>'+e(q.codigo)+'</h2><div class="field"><label>Título</label><input id="qt" value="'+e(q.titulo)+'"></div><div class="field"><label>Enunciado</label><textarea id="qe" rows="7">'+e(q.enunciado)+'</textarea></div><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveQ(&quot;'+id+'&quot;)">Salvar</button></div>';back.classList.add("show")};
window.saveQ=async function(id){try{await api("update_question",{id:id,titulo:document.getElementById("qt").value,enunciado:document.getElementById("qe").value});closeM();toast("Pergunta atualizada.");await boot(true)}catch(x){toast(x.message)}}
function settings(d){return'<div class="grid">'+d.settings.map(function(s){return'<div class="card"><h3>'+e(s.chave)+'</h3><p class="muted">'+e(s.descricao||"")+'</p><div class="field"><input id="set_'+s.chave.replaceAll(".","_")+'" value="'+e(typeof s.valor==="string"?s.valor:JSON.stringify(s.valor))+'"></div><button class="btn primary small" onclick="saveSetting(&quot;'+s.chave+'&quot;)">Salvar</button></div>'}).join("")+'</div>'}
window.saveSetting=async function(k){var id="set_"+k.replaceAll(".","_"),v=document.getElementById(id).value;try{await api("update_setting",{chave:k,valor:v});toast("Configuração atualizada.");await boot(true)}catch(x){toast(x.message)}}
function admins(d){return'<div class="card"><div class="top"><div><h3>Contas administrativas</h3><p class="muted">Superadmin controla o sistema. Secretário-Geral trabalha com o Rodízio.</p></div><button class="btn primary small" onclick="newAdmin()">Nova conta</button></div></div><table class="table" style="margin-top:10px"><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Estado</th></tr></thead><tbody>'+d.admins.map(function(a){return'<tr><td>'+e(a.nome_exibicao||"")+'</td><td>'+e(a.email||"")+'</td><td><span class="code">'+e(a.papel)+'</span></td><td>'+(a.ativo?'<span class="pill ok">ativo</span>':'<span class="pill">inativo</span>')+'</td></tr>'}).join("")+'</tbody></table>'}
window.newAdmin=function(){box.innerHTML='<div class="ey">NOVA CONTA ADMINISTRATIVA</div><h2>Provisionar acesso</h2><div class="field"><label>Nome</label><input id="an"></div><div class="field"><label>E-mail</label><input id="ae" type="email"></div><div class="field"><label>Senha inicial</label><input id="ap" type="password"></div><div class="field"><label>Papel</label><select id="ar"><option value="secretario_geral">Secretário-Geral</option><option value="revisor">Revisor</option><option value="superadmin">Superadmin</option></select></div><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="createAdmin()">Criar conta</button></div>';back.classList.add("show")};
window.createAdmin=async function(){try{await api("create_admin",{nome:document.getElementById("an").value,email:document.getElementById("ae").value,password:document.getElementById("ap").value,papel:document.getElementById("ar").value});closeM();toast("Conta criada.");await boot(true)}catch(x){toast(x.message)}}
function audit(d){return'<div class="card"><h3>Auditoria recente</h3><p class="muted">Ações administrativas sensíveis registradas pelo Rod27.</p></div>'+d.audit.map(function(a){return'<div class="audit"><strong>'+e(a.acao)+'</strong> · '+e(a.papel||"")+'<br><span class="muted">'+e(a.entidade||"")+' '+e(a.entidade_id||"")+' · '+e(new Date(a.criado_em).toLocaleString("pt-BR"))+'</span></div>'}).join("")}
window.revokeAll=async function(){if(!confirm("Encerrar todas as sessões ativas dos coordenadores? Eles precisarão entrar novamente."))return;try{await api("revoke_all_coordinator_sessions");toast("Sessões encerradas.");await boot(true)}catch(x){toast(x.message)}}
async function boot(silent){S.a=sessionStorage.getItem("ctl_a")||S.a;S.r=sessionStorage.getItem("ctl_r")||S.r;if(!S.a){login();return}try{S.data=await api("bootstrap");render()}catch(x){if(!silent){clr();login(x.message)}else toast(x.message)}}
boot();
</script></body></html>
