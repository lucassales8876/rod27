 try{await api("set_self_evaluation",{permitida:permitida});toast("Regra atualizada.");await boot(true)}

 try{await api("archive_question",{id:id});toast("Pergunta arquivada.");await boot(true)}
 catch(x){toast(x.message)}
};
function settings(d){
 var labels={
 "coordenador.login.bloqueio_minutos":["Bloqueio após falhas de senha","O coordenador fica temporariamente impedido de entrar quando erra a senha várias vezes. Não é um limite de inatividade."],
 "coordenador.login.max_falhas":["Tentativas incorretas permitidas","Número de falhas consecutivas do PIN para um mesmo ROL antes do bloqueio. O bloqueio é da credencial, não só deste dispositivo."],
 "coordenador.sessao.horas":["Duração máxima do acesso","Tempo até uma sessão autenticada expirar. Não tem relação com tentativas erradas de senha."],
 "coordenador.senha.formato":["Formato do PIN inicial","Padrão implementado: PIN de 6 dígitos. Mudar o texto deste campo não gera PINs novos nem modifica os existentes."]
 };
 var units={"coordenador.login.bloqueio_minutos":"minutos","coordenador.login.max_falhas":"tentativas","coordenador.sessao.horas":"horas","coordenador.senha.formato":"dígitos"};
 return'<div class="card" style="margin-bottom:12px"><h3>Política de acesso dos coordenadores</h3><p class="muted">Estas opções são configurações de segurança, não uma lista de senhas. Para consultar ROLs ou gerar um PIN novo, use a aba <b>Contas</b>.</p></div><div class="grid">'+d.settings.filter(function(x){return Object.prototype.hasOwnProperty.call(labels,x.chave)}).map(function(x){
 var a=labels[x.chave]||[x.chave,x.descricao||""],editable=x.chave!=="coordenador.senha.formato",v=typeof x.valor==="string"?x.valor:JSON.stringify(x.valor);
 return'<div class="card"><h3>'+e(a[0])+'</h3><p class="muted">'+e(a[1])+'</p><div class="field"><label>Valor atual ('+units[x.chave]+')</label>'+(editable?'<input type="number" min="1" max="1440" id="set_'+x.chave.replaceAll(".","_")+'" value="'+e(v)+'">':'<div class="code">PIN de 6 dígitos · formato fixo nesta versão</div>')+'</div>'+(editable?'<button class="btn primary small" onclick="saveSetting(&quot;'+x.chave+'&quot;)">Salvar configuração</button>':'')+'</div>'
 }).join("")+'</div>';
}
window.saveSetting=async function(k){var id="set_"+k.replaceAll(".","_"),v=document.getElementById(id).value;try{await api("update_setting",{chave:k,valor:v});toast("Configuração atualizada.");await boot(true)}catch(x){toast(x.message)}}
function admins(d){return credentialsHtml()+'<div class="card"><div class="top"><div><h3>Contas administrativas</h3><p class="muted">Superadmin controla o sistema. Secretário-Geral trabalha com o Rodízio.</p></div><button class="btn primary small" onclick="newAdmin()">Nova conta</button></div></div><table class="table" style="margin-top:10px"><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Estado</th></tr></thead><tbody>'+d.admins.map(function(a){return'<tr><td>'+e(a.nome_exibicao||"")+'</td><td>'+e(a.email||"")+'</td><td><span class="code">'+e(a.papel)+'</span></td><td>'+(a.ativo?'<span class="pill ok">ativo</span>':'<span class="pill">inativo</span>')+'</td></tr>'}).join("")+'</tbody></table>'}
window.newAdmin=function(){box.innerHTML='<div class="ey">NOVA CONTA ADMINISTRATIVA</div><h2>Provisionar acesso</h2><div class="field"><label>Nome</label><input id="an"></div><div class="field"><label>E-mail</label><input id="ae" type="email"></div><div class="field"><label>Senha inicial</label><input id="ap" type="password"></div><div class="field"><label>Papel</label><select id="ar"><option value="secretario_geral">Secretário-Geral</option><option value="revisor">Revisor</option><option value="superadmin">Superadmin</option></select></div><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="createAdmin()">Criar conta</button></div>';back.classList.add("show")};
window.createAdmin=async function(){try{await api("create_admin",{nome:document.getElementById("an").value,email:document.getElementById("ae").value,password:document.getElementById("ap").value,papel:document.getElementById("ar").value});closeM();toast("Conta criada.");await boot(true)}catch(x){toast(x.message)}}
async function secretariaApi(action,p,retry){
 var x=await fetch(U+"/functions/v1/rod27-admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.a},body:JSON.stringify(Object.assign({action:action},p||{}))});
 if(x.status===401&&!retry&&await rf())return secretariaApi(action,p,true);
 var j=await x.json().catch(function(){return{ok:false,error:"Resposta inválida."}});
 if(!x.ok||!j.ok)throw new Error(j.error||"Não foi possível consultar os acessos.");
 return j;
}
function credentialsHtml(){
 var h='<div class="card" style="margin-bottom:12px"><h3>Credenciais dos 42 coordenadores</h3><p class="muted">Somente redefinições autorizadas. O novo PIN é exibido uma vez; PINs antigos não podem ser consultados.</p></div>';
 if(!S.coordData)return h+'<div class="card" id="coordList">Consultando credenciais…</div>';
 var sectors=S.coordData.sectors||[];
 h+='<div class="card" id="coordList" style="overflow-x:auto"><table class="table"><thead><tr><th>Setor</th><th>Coordenador</th><th>ROL</th><th>Estado</th><th>Ação</th></tr></thead><tbody>';
 h+=sectors.map(function(x){return'<tr><td>'+e(x.setor)+'</td><td>'+e(x.coordenador)+'</td><td><span class="code">'+e(x.rol)+'</span></td><td>'+e(x.credencial_status)+'</td><td><button class="btn ghost small" onclick="rotateCoordinatorPIN('+Number(x.setor)+')">Redefinir PIN</button></td></tr>'}).join("");
 return h+'</tbody></table></div>';
}
async function loadCoordinatorAccess(){
 try{S.coordData=await secretariaApi("bootstrap");if(S.tab==="admins")render()}
 catch(x){var node=document.getElementById("coordList");if(node)node.textContent="Não foi possível consultar os coordenadores: "+x.message}
}
window.rotateCoordinatorPIN=async function(n){
 var s=S.coordData&&S.coordData.sectors&&S.coordData.sectors.find(function(x){return Number(x.setor)===Number(n)});
 if(!s){toast("Setor não encontrado.");return}
 if(!confirm("Redefinir o PIN do setor "+n+" ("+s.coordenador+", ROL "+s.rol+")? O PIN anterior deixará de funcionar imediatamente e todas as sessões anteriores serão invalidadas."))return;
 try{
  var d=await secretariaApi("reset_coordinator_pin",{setor:n});
  box.innerHTML='<div class="ey">NOVO PIN GERADO</div><h2>Setor '+e(n)+'</h2><p><b>'+e(s.coordenador)+'</b> · ROL <span class="code">'+e(d.rol)+'</span></p><p class="muted">Este novo PIN aparece apenas uma vez. Copie e entregue ao coordenador por um canal seguro. O PIN antigo já foi substituído.</p><div class="card"><div class="ey">Novo PIN</div><h2 class="code" style="letter-spacing:.15em">'+e(d.pin)+'</h2></div><div class="actions"><button class="btn primary" onclick="copyNewPin()">Copiar ROL e PIN</button><button class="btn ghost" onclick="closeM()">Fechar</button></div>';
  window._latestPinInfo={rol:String(d.rol),pin:String(d.pin)};
  back.classList.add("show");
  S.coordData=await secretariaApi("bootstrap");
 }catch(x){toast(x.message)}
}
window.copyNewPin=async function(){
 var c=window._latestPinInfo;
 if(!c)return;
 try{await navigator.clipboard.writeText("ROL: "+c.rol+"\nPIN: "+c.pin);toast("ROL e PIN copiados.")}catch(x){toast("Copie manualmente o PIN exibido.")}
};
document.addEventListener("visibilitychange",function(){if(document.hidden&&window._latestPinInfo)closeM()});window.addEventListener("pagehide",closeM);
var AUDIT_AUTH={grant:null};
function audit(d){
 var form=S.auditOpen&&!AUDIT_AUTH.grant?'<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:9px;align-items:center"><input id="audit_joint_pass" aria-label="Autorização" type="password" autocomplete="off" style="width:min(360px,80%);border:1px solid var(--line);padding:11px;border-radius:10px" onkeydown="if(event.key===\'Enter\'){event.preventDefault();authorizeAudit()}"><button type="button" class="btn ghost" aria-label="Confirmar" onclick="authorizeAudit()">✓</button></div></div>':"";
 return form+d.audit.map(function(a){
  return '<div class="audit"><strong>'+e(a.acao)+'</strong> · '+e(a.papel||"")+'<br><span class="muted">'+e(a.entidade||"")+' '+e(a.entidade_id||"")+' · '+e(new Date(a.criado_em).toLocaleString("pt-BR"))+'</span>'+
   (AUDIT_AUTH.grant?'<div class="actions"><button class="btn danger small" onclick="openAuditRemoval(&quot;'+e(a.id)+'&quot;)">Remover registro</button></div>':"")+'</div>';
 }).join("");
}
window.authorizeAudit=async function(){
 var inp=document.getElementById("audit_joint_pass"),pw=inp?inp.value:"";
 if(!pw)return;
 try{
  var result=await api("authorize_audit_removal",{password:pw});
  AUDIT_AUTH.grant=result.grant;S.auditOpen=false;inp.value="";render();
 }catch(err){
  AUDIT_AUTH.grant=null;
  S.auditOpen=false;
  if(inp)inp.value="";
  render();
 }
};
window.openAuditRemoval=function(id){
 if(!AUDIT_AUTH.grant)return;
 box.innerHTML='<div class="ey">CONTROLE SUPERIOR · REGISTRO DE AUDITORIA</div><h2>Exclusão administrativa</h2><p class="muted">O conteúdo deste registro será excluído. Permanecerá o registro mínimo de que a exclusão foi autorizada, por quem foi solicitada e qual foi a justificativa. Esta ação não desfaz a operação original.</p><div class="field"><label>Quem determinou a exclusão?</label><input id="audit_requested_by" maxlength="160" placeholder="Autoridade solicitante"></div><div class="field"><label>Motivo e referência da determinação</label><textarea id="audit_reason" rows="4" maxlength="2000" placeholder="Registre a razão da exclusão"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn danger" onclick="removeAuditEntry(&quot;'+e(id)+'&quot;)">Confirmar exclusão</button></div>';
 back.classList.add("show");
};
window.removeAuditEntry=async function(id){
 var by=document.getElementById("audit_requested_by").value.trim(),why=document.getElementById("audit_reason").value.trim();
 if(by.length<3||why.length<12){toast("Informe o solicitante e o motivo da exclusão.");return}
 if(!confirm("Excluir este registro do histórico comum? A exclusão terá uma trilha administrativa própria."))return;
 try{await api("remove_audit_entry",{registro_id:id,solicitante:by,motivo:why,grant:AUDIT_AUTH.grant});closeM();toast("Registro excluído. A exclusão foi auditada.");await boot(true)}
 catch(err){AUDIT_AUTH.grant=null;closeM();await boot(true);toast("Autorização inválida ou expirada. Valide novamente.")}
};
window.revokeAll=async function(){if(!confirm("Encerrar todas as sessões ativas dos coordenadores? Eles precisarão entrar novamente."))return;try{await api("revoke_all_coordinator_sessions");toast("Sessões encerradas.");await boot(true)}catch(x){toast(x.message)}}
async function boot(silent){S.a=sessionStorage.getItem("ctl_a")||S.a;S.r=sessionStorage.getItem("ctl_r")||S.r;if(!S.a){login();return}try{S.data=await api("bootstrap");render();if(S.tab==="overview")refreshHealth(false)}catch(x){if(!silent){clr();login(x.message)}else toast(x.message)}}
boot();
