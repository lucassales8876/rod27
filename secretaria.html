<script>
var PROJECT_URL="https://zrjxxcytgtjuuinhkfux.supabase.co",PUBLISHABLE_KEY="sb_publishable_p6zUbFwkzvfv_7XUMqhxwA_BjGCxIEh",S={access:null,refresh:null,admin:null,data:null};
var app=document.getElementById("app"),back=document.getElementById("back"),box=document.getElementById("modal");
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[x]})}

function saveSession(d){S.access=d.access_token;S.refresh=d.refresh_token;sessionStorage.setItem("r27a",S.access||"");sessionStorage.setItem("r27r",S.refresh||"")}

async function refresh(){if(!S.refresh)return false;var r=await fetch(PROJECT_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.refresh})});if(!r.ok){clearSession();return false}saveSession(await r.json());return true}
async function api(action,p,retry){var r=await fetch("https://zrjxxcytgtjuuinhkfux.supabase.co/functions/v1/rod27-admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.access},body:JSON.stringify(Object.assign({action:action},p||{}))});if(r.status===401&&!retry&&await refresh())return api(action,p,true);var j=await r.json().catch(function(){return{ok:false,error:"Resposta inválida."}});if(!r.ok||!j.ok)throw new Error(j.error||"Falha na comunicação.");return j}
function loginView(msg){app.innerHTML='<div class="login"><div class="ey">ROD27 · SECRETARIA</div><h2>Acesso administrativo</h2><p class="muted">Área operacional do Rodízio.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"></div><div id="err" class="error">'+e(msg||"")+'</div><button class="btn primary" style="width:100%" onclick="login()">Entrar</button></div>'}
window.login=async function(){var email=document.getElementById("email").value.trim(),password=document.getElementById("pass").value,err=document.getElementById("err");err.textContent="Entrando…";try{var r=await fetch(PROJECT_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:password})}),j=await r.json();if(!r.ok)throw new Error("E-mail ou senha inválidos.");saveSession(j);await boot()}catch(x){err.textContent=x.message}}

function render(){var d=S.data,a=d.admin;app.innerHTML='<section class="hero"><div class="topline"><div><div class="ey">ROD27 · SECRETARIA GERAL</div><h1>Painel do Rodízio 2027</h1><p>'+e(a.nome_exibicao||a.email||"Administrador")+' · '+e(a.papel)+'</p></div><button class="btn ghost small" onclick="logout()">Sair</button></div><div class="badges"><span class="badge">'+d.summary.setores+' setores</span><span class="badge">'+d.summary.total+' avaliações</span><span class="badge">'+d.summary.enviadas+' enviadas</span></div><div class="actions"><button class="btn ghost small" type="button" onclick="exportProgress()">Exportar andamento CSV</button></div></section><main><div class="summary"><div class="kpi"><strong>'+d.summary.enviadas+'</strong><span>Enviadas</span></div><div class="kpi"><strong>'+d.summary.em_preenchimento+'</strong><span>Em andamento</span></div><div class="kpi"><strong>'+d.summary.nao_iniciadas+'</strong><span>Não iniciadas</span></div><div class="kpi"><strong>'+d.summary.credenciais_ativas+'</strong><span>Coordenadores liberados</span></div></div><div class="sectors">'+d.sectors.map(secHtml).join("")+'</div></main>'}
window.exportProgress=function(){
  if(!S.data||!Array.isArray(S.data.sectors)){toast("Aguarde o carregamento dos setores.");return;}
  var head=["Setor","Área","Avaliações totais","Próprio coordenador","Avaliações dos dirigentes","Não iniciadas","Em preenchimento","Enviadas","Status do acesso"];
  var rows=S.data.sectors.map(function(s){return[s.setor,s.area,s.total,s.tratamento_especial,Math.max(0,s.total-s.tratamento_especial),s.nao_iniciadas,s.em_preenchimento,s.enviadas,s.credencial_status]});
  var safe=function(v){var t=String(v==null?"":v).replace(/[\r\n]/g," ");if(/^\s*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
  var csv="\uFEFF"+[head].concat(rows).map(function(a){return a.map(safe).join(";")}).join("\r\n");
  var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a");a.href=url;a.download="rod27-andamento-setores-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000);
  toast("Relatório CSV gerado. Nenhuma resposta em rascunho foi incluída.");
};
function secHtml(s){var usable=s.total-s.tratamento_especial,p=usable?Math.round(s.enviadas/usable*100):0,can=S.data.admin.papel!=="revisor";return'<article class="sector"><div class="sectorHead"><h3>Setor '+s.setor+'</h3>'+credTag(s.credencial_status)+'</div><div class="coord">'+e(s.coordenador)+' · ROL '+e(s.rol)+' · Área '+e(s.area)+'</div><div class="row"><span>Progresso</span><strong>'+s.enviadas+'/'+usable+'</strong></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="row"><span>Em andamento</span><span>'+s.em_preenchimento+'</span></div><div class="actions"><button class="btn primary small" onclick="openSector('+s.setor+')">Abrir setor</button>'+(can?'<button class="btn ghost small" onclick="officeChangeCoordinator('+s.setor+')">Trocar coordenador</button><button class="btn ghost small" onclick="resetPin('+s.setor+')">'+(s.credencial_status==="nao_configurada"?"Liberar acesso":"Redefinir senha")+'</button>':"")+(can&&s.credencial_status!=="revogada"&&s.credencial_status!=="nao_configurada"?'<button class="btn danger small" onclick="revoke('+s.setor+')">Revogar</button>':"")+'</div></article>'}
window.openSector=async function(n){try{var d=await api("sector",{setor:n});S.openSectorData=d;box.innerHTML='<div class="ey">SETOR '+n+'</div><h2>'+e(d.coordenador)+'</h2><p class="muted">Área '+e(d.area)+' · '+d.evaluations.length+' dirigentes</p>'+d.evaluations.map(function(x){var st=x.status==="enviada"?"sent":(x.status==="em_preenchimento"?"draft":"new");return'<div class="eval"><div><b>'+e(x.dirigente_nome_snapshot)+'</b><span>'+e(x.congregacao_nome_snapshot)+'</span></div><div><span class="'+st+'">'+e(x.status.replaceAll("_"," "))+'</span>'+(x.status==="enviada"?'<br><button class="btn ghost small" onclick="openEval(&quot;'+x.id+'&quot;)">Ver envio e classificar</button>':'<br><span class="muted">Aguardando preenchimento</span>')+'<br><button class="btn ghost small" onclick="printBlank(&quot;'+x.id+'&quot;)">Imprimir formulário em branco</button>'+(x.status!=="enviada"?'<br><button class="btn ghost small" onclick="officeEditDirigente(&quot;'+x.id+'&quot;)">Corrigir dirigente</button><button class="btn ghost small" onclick="officeTranscription(&quot;'+x.id+'&quot;)">Transcrever entrevista em papel / anexar PDF</button>':'<br><button class="btn ghost small" onclick="officeViewDocuments(&quot;'+x.id+'&quot;)">Consultar documento original</button>') +'</div></div>'}).join("")+'<div class="actions"><button class="btn ghost" onclick="closeM()">Fechar</button></div>';back.classList.add("show")}catch(x){toast(x.message)}};
window.printBlank=async function(id){
 var d=S.openSectorData,ev=d&&d.evaluations&&d.evaluations.find(function(x){return x.id===id});
 if(!ev){toast("Abra primeiro o setor correspondente.");return}
 var w=window.open("","_blank");
 if(!w){toast("Autorize janelas para imprimir o formulário.");return}
 w.document.title="Preparando formulário";
 w.document.body.textContent="Preparando formulário para impressão…";
 try{
  var f=await api("blank_form",{setor:d.setor});
  var q=f.questions||[],coord=(S.data.sectors||[]).find(function(x){return Number(x.setor)===Number(d.setor)})||{};
  var warning=f.form.status!=="publicado";
  var hdr='<div class="header"><div class="brand">IEADERN · RODÍZIO 2027</div><h1>Formulário de avaliação do dirigente</h1><p>Preenchimento manuscrito pelo coordenador do setor</p></div>';
  var info='<div class="meta"><p><b>Setor:</b> '+e(d.setor)+' · <b>Área:</b> '+e(d.area)+'</p><p><b>Coordenador:</b> '+e(d.coordenador)+' · <b>ROL:</b> '+e(coord.rol||"")+'</p><p><b>Dirigente:</b> '+e(ev.dirigente_nome_snapshot)+'</p><p><b>Congregação:</b> '+e(ev.congregacao_nome_snapshot)+'</p></div>';
  var items=q.map(function(x){
   var h='<section class="q"><div class="qtitle">'+e(x.ordem)+'. '+e(x.titulo)+(x.obrigatoria?' <span>*</span>':'')+'</div><p>'+e(x.enunciado||"")+'</p>';
   if(x.tipo_resposta==="escolha_unica"){h+='<div class="options">'+(x.opcoes||[]).map(function(o){return'<div class="option">□ '+e(o)+'</div>'}).join("")+'</div>';}
   else {h+='<div class="lines">'+Array(5).fill('<div></div>').join("")+'</div>';}
   return h+'</section>';
  }).join("");
  var html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Rod27 · Ficha em branco</title><style>@page{size:A4;margin:15mm}*{box-sizing:border-box}body{font:12px/1.4 Arial,sans-serif;color:#17223b;margin:0}.header{text-align:center;border-bottom:2px solid #17223b;padding-bottom:9px}.brand{font-size:11px;letter-spacing:2px;font-weight:800}.header h1{font-size:19px;margin:4px 0}.header p{margin:0}.meta{border:1px solid #aaa;padding:8px 12px;margin:14px 0}.meta p{margin:3px 0}.q{break-inside:avoid;border-bottom:1px solid #ccc;padding:9px 0}.qtitle{font-weight:800;font-size:13px}.q p{white-space:pre-wrap;margin:6px 0}.lines div{height:24px;border-bottom:1px solid #b6b6b6}.options{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:9px 0}.option{font-size:12px}.warning{padding:9px;text-align:center;border:2px solid #a53d3d;color:#a53d3d;font-weight:800}.footer{break-inside:avoid;margin-top:24px}.sign{margin-top:55px;border-top:1px solid #222;text-align:center;width:72%;margin-left:auto;margin-right:auto;padding-top:4px}.stamp{font-size:10px;color:#777;margin-top:12px}.printctrl{margin:10px 0;padding:10px;text-align:right;background:#eee}@media print{.printctrl{display:none}}</style></head><body>';
  html+='<div class="printctrl"><button onclick="window.print()">Imprimir / Salvar em PDF</button></div>';

async function officeLookup(rol){
 var j=await api("office_lookup_obreiro",{rol:String(rol||"").trim()});
 return j.obreiro;
}
window.officeChangeCoordinator=function(n){
 var x=S.data.sectors.find(function(z){return Number(z.setor)===Number(n)});
 if(!x){toast("Setor não encontrado.");return}
 S.pendingCoordinator=null;
 box.innerHTML='<div class="ey">ALTERAÇÃO DE COORDENADOR</div><h2>Setor '+e(n)+'</h2><p>Coordenador atual: <b>'+e(x.coordenador)+'</b> · ROL '+e(x.rol)+'</p><div class="warning">Esta operação altera o ROL do setor, invalida todas as sessões antigas e gera um novo PIN aleatório. Confira os dados antes de confirmar.</div><div class="field"><label>ROL do novo coordenador</label><input id="office_coord_rol" placeholder="Informe o ROL"></div><button class="btn ghost" onclick="officePreviewCoordinator('+n+')">Conferir ROL</button><div id="office_coord_preview" class="field"></div><div class="actions"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="officeConfirmCoordinator('+n+')">Confirmar substituição</button></div>';

};
window.officePreviewCoordinator=async function(n){
 var input=document.getElementById("office_coord_rol"),node=document.getElementById("office_coord_preview");
 try{
  var r=await officeLookup(input.value);
  if(!r||r.rol===S.data.sectors.find(x=>Number(x.setor)===Number(n)).rol)throw new Error("Este ROL já é o coordenador do setor.");
  S.pendingCoordinator=r;
  node.innerHTML='<p><b>Conferido no fichário:</b> '+e(r.nome)+' · ROL '+e(r.rol)+'</p>';
 }catch(err){S.pendingCoordinator=null;node.textContent=err.message}
};
window.officeConfirmCoordinator=async function(n){
 var r=S.pendingCoordinator,current=S.data.sectors.find(x=>Number(x.setor)===Number(n));
 if(!r||String(r.rol)!==document.getElementById("office_coord_rol").value.trim()){toast("Confira o ROL primeiro.");return}
 if(!confirm("CONFIRMAR troca do setor "+n+"?\nAntigo: "+current.coordenador+" (ROL "+current.rol+")\nNovo: "+r.nome+" (ROL "+r.rol+")\nO acesso antigo será invalidado e um PIN novo será criado."))return;
 try{
  var result=await api("office_change_coordinator",{setor:n,rol:r.rol});
  await boot(true);
  S.pendingCoordinator=null;
  box.innerHTML='<div class="ey">COORDENADOR ALTERADO</div><h2>'+e(r.nome)+'</h2><p><b>ROL:</b> '+e(r.rol)+'</p><div class="warning">O ROL e o PIN anteriores perderam o acesso. Este PIN novo é mostrado uma única vez. Entregue-o ao responsável por um canal seguro.</div><div class="linkbox"><span style="font-size:27px;letter-spacing:.18em">'+e(result.pin)+'</span></div><p class="muted">Fichas especiais vinculadas ao novo coordenador: '+e(result.coordenador?.fichas_especiais??"?")+'. Confira o tratamento dessas fichas.</p><div class="actions"><button class="btn ghost" onclick="closeM()">Fechar</button></div>';
  back.classList.add("show");
 }catch(err){toast(err.message)}
};

 if(!x){toast("Ficha não encontrada.");return}

 try{
  var j=await api("office_documents",{avaliacao_id:id}),docs=j.documentos||[];
  box.innerHTML='<div class="ey">DOCUMENTOS ORIGINAIS</div><h2>Arquivo de auditoria</h2><p class="muted">Cada consulta gera um link temporário de cinco minutos e é registrada na auditoria.</p>'+(docs.length?docs.map(function(d){return'<div class="eval"><div><b>'+e(d.nome_original)+'</b><span>'+e(new Date(d.enviado_em).toLocaleString("pt-BR"))+' · OCR: '+e(d.status_ocr)+'</span></div><button class="btn ghost small" onclick="officeOpenDoc(&quot;'+e(d.id)+'&quot;)">Abrir</button></div>'}).join(""):'<p>Nenhum documento anexado.</p>')+'<div class="actions"><button class="btn ghost" onclick="closeM()">Fechar</button></div>';
  back.classList.add("show");

window.officeOpenDoc=async function(docId){
 var w=window.open("","_blank");
 if(!w){toast("Autorize uma nova aba para visualizar.");return}
 w.document.body.textContent="Preparando acesso temporário…";
 try{var j=await api("office_document_url",{documento_id:docId});w.location.assign(j.url)}
 catch(err){w.close();toast(err.message)}
};
window.officeTranscription=async function(id){
 try{
  var d=await api("office_transcription",{avaliacao_id:id});
  S.paperDraft=d;
  var old=new Map((d.rascunho?.respostas||[]).map(function(x){return[String(x.pergunta_id),String(x.resposta||"")]}));
  var h='<div class="ey">ENTREVISTA EM PAPEL</div><h2>'+e(d.avaliacao.dirigente_nome_snapshot)+'</h2><p>'+e(d.avaliacao.congregacao_nome_snapshot)+'</p><div class="warning">Transcrição administrativa. Identifique o documento original assinado. O sistema não atribuirá esse envio a uma autenticação digital do coordenador. OCR automático ainda não está disponível.</div>';
  h+='<div class="field"><label>Anexar PDF ou foto do formulário assinado (máx. 8 MB)</label><input id="office_file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></div><button class="btn ghost small" onclick="officeUploadSignedDocument()">Anexar documento</button>';
  h+='<div class="field"><label>Documento original utilizado na transcrição</label><select id="office_doc_id"><option value="">Sem documento selecionado</option>';
  h+=(d.documentos||[]).map(function(x){return'<option value="'+e(x.id)+'" '+(d.rascunho?.documento_id===x.id?'selected':'')+'>'+e(x.nome_original)+' · '+e(new Date(x.enviado_em).toLocaleDateString("pt-BR"))+'</option>'}).join("");
  h+='</select></div>';
  h+=(d.perguntas||[]).map(function(q){
   var value=old.get(String(q.id))||"";
   var input=q.tipo_resposta==="escolha_unica"?'<select id="paper_'+e(q.id)+'"><option value="">Selecione</option>'+(q.opcoes||[]).map(function(opt){return'<option value="'+e(opt)+'" '+(value===String(opt)?'selected':'')+'>'+e(opt)+'</option>'}).join("")+'</select>':'<textarea rows="4" id="paper_'+e(q.id)+'">'+e(value)+'</textarea>';
   return'<div class="field"><label>'+e(q.ordem)+'. '+e(q.titulo)+(q.obrigatoria?' *':'')+' ['+e(q.status)+']</label>'+input+'</div>'
  }).join("");
  h+='<div class="actions"><button class="btn ghost" onclick="officeSavePaper(false)">Salvar rascunho</button><button class="btn primary" onclick="officeSavePaper(true)">Concluir e enviar transcrição</button><button class="btn ghost" onclick="closeM()">Cancelar</button></div>';
  box.innerHTML=h;back.classList.add("show");
 }catch(err){toast(err.message)}
};
window.officeUploadSignedDocument=async function(){
 var d=S.paperDraft,file=document.getElementById("office_file")?.files?.[0];
 if(!file){toast("Selecione um arquivo primeiro.");return}
 if(file.size>8388608||file.size===0){toast("O limite é 8 MB.");return}
 if(!["application/pdf","image/jpeg","image/png"].includes(file.type)){toast("Selecione PDF, JPG ou PNG.");return}
 try{
  var data=await new Promise(function(ok,fail){var r=new FileReader();r.onload=function(){ok(String(r.result||"").split(",")[1])};r.onerror=fail;r.readAsDataURL(file)});
  await api("office_upload_document",{avaliacao_id:d.avaliacao.id,nome:file.name,tipo_mime:file.type,base64:data});
  toast("Documento original guardado no arquivo privado.");
  await officeTranscription(d.avaliacao.id);
 }catch(err){toast(err.message)}
};
window.officeSavePaper=async function(finalizar){
 var d=S.paperDraft;if(!d){toast("Formulário não carregado.");return}
 var respostas=(d.perguntas||[]).map(function(q){var el=document.getElementById("paper_"+q.id);return{pergunta_id:q.id,resposta:el?el.value:""}});
 var documento_id=document.getElementById("office_doc_id")?.value||null;
 if(finalizar){
  if(!documento_id){toast("Anexe e selecione o documento original assinado.");return}
  if(!confirm("Concluir a transcrição? As respostas serão marcadas como enviadas pela Secretaria, com referência ao original assinado e auditoria."))return;
 }
 try{
  await api("office_save_transcription",{avaliacao_id:d.avaliacao.id,respostas,documento_id,finalizar:!!finalizar});
  if(finalizar){closeM();toast("Transcrição enviada e auditada.");await boot(true)}
  else{toast("Rascunho da transcrição salvo.");await officeTranscription(d.avaliacao.id)}
 }catch(err){toast(err.message)}
};
function sel(name,val){var opts=["","pessimo","ruim","mediano","bom","excelente"],labels={"":"Selecione","pessimo":"Péssimo","ruim":"Ruim","mediano":"Mediano","bom":"Bom","excelente":"Excelente"};return'<select id="'+name+'">'+opts.map(function(o){return'<option value="'+o+'" '+(o===val?"selected":"")+'>'+labels[o]+'</option>'}).join("")+'</select>'}
window.openEval=async function(id){try{var d=await api("evaluation",{avaliacao_id:id}),c=d.classification||{},h='<div class="ey">AVALIAÇÃO ENVIADA</div><h2>'+e(d.evaluation.dirigente_nome_snapshot)+'</h2><p class="muted">'+e(d.evaluation.congregacao_nome_snapshot)+'</p>';h+=d.answers.map(function(a){return'<div class="answer"><h4>'+e(a.titulo)+'</h4><p>'+e(a.resposta)+'</p></div>'}).join("");h+='<div class="classify"><h3>Classificação administrativa</h3><p class="muted">Esta classificação é posterior à narrativa e não altera o texto original do coordenador.</p><div class="classGrid"><div class="field"><label>Qualificação</label>'+sel("qlf",c.qualificacao||"")+'</div><div class="field"><label>Reputação</label>'+sel("rpt",c.reputacao||"")+'</div><div class="field"><label>Capacitação</label>'+sel("cpt",c.capacitacao||"")+'</div><div class="field"><label>Engajamento</label>'+sel("egj",c.engajamento||"")+'</div></div><div class="field"><label>Resumo / observação da análise</label><textarea id="resumo" rows="4">'+e(c.resumo_analitico||"")+'</textarea></div><button class="btn primary" onclick="saveClass(&quot;'+id+'&quot;)">Salvar classificação</button></div><div class="actions"><button class="btn ghost" onclick="openSector('+d.setor+')">Voltar ao setor</button></div>';box.innerHTML=h}catch(x){toast(x.message)}};
window.saveClass=async function(id){var p={avaliacao_id:id,qualificacao:document.getElementById("qlf").value,reputacao:document.getElementById("rpt").value,capacitacao:document.getElementById("cpt").value,engajamento:document.getElementById("egj").value,resumo:document.getElementById("resumo").value};if(!p.qualificacao||!p.reputacao||!p.capacitacao||!p.engajamento){toast("Classifique as quatro dimensões.");return}try{await api("save_classification",p);toast("Classificação salva.")}catch(x){toast(x.message)}};
window.resetPin=async function(n){try{var d=await api("reset_coordinator_pin",{setor:n});box.innerHTML='<div class="ey">ACESSO DO COORDENADOR</div><h2>Setor '+n+'</h2><div class="warning"><strong>Guarde esta senha agora.</strong><br>Ela é mostrada somente neste momento. Redefinir novamente invalida todas as sessões anteriores.</div><div class="linkbox"><strong>ROL '+e(d.rol)+'</strong><br><span style="font-size:28px;letter-spacing:.18em">'+e(d.pin)+'</span></div><div class="actions"><button class="btn primary" onclick="copyCred(&quot;'+e(d.rol)+'&quot;,&quot;'+e(d.pin)+'&quot;)">Copiar credenciais</button><button class="btn ghost" onclick="closeM()">Fechar</button></div>';back.classList.add("show");await boot(true)}catch(x){toast(x.message)}};
window.copyCred=async function(r,p){try{await navigator.clipboard.writeText("ROL: "+r+"\nSenha: "+p);toast("Credenciais copiadas.")}catch(x){toast("Não foi possível copiar automaticamente.")}};
window.revoke=async function(n){if(!confirm("Revogar o login do coordenador do Setor "+n+"?"))return;try{await api("revoke_coordinator",{setor:n});toast("Acesso revogado.");await boot(true)}catch(x){toast(x.message)}};
async function boot(silent){S.access=sessionStorage.getItem("r27a")||S.access;S.refresh=sessionStorage.getItem("r27r")||S.refresh;if(!S.access){loginView();return}try{S.data=await api("bootstrap");S.admin=S.data.admin;render()}catch(x){if(!silent){clearSession();loginView(x.message)}else toast(x.message)}}
boot();
</script></body></html>
