<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Rod27 · Fichas especiais</title>
<style>
:root{--navy:#17223b;--paper:#f5f2ec;--line:#e4ded3;--muted:#69707c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:24px auto;padding:0 18px}header{background:var(--navy);color:white;padding:24px;border-radius:20px}h1,h2{margin:0 0 8px}a{color:inherit}.notice{background:#fff1cf;border-left:4px solid #b7873f;padding:12px;margin:16px 0}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.muted{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:10px;background:var(--navy);color:white;padding:10px 14px;font:inherit;cursor:pointer}button.secondary{background:#eee9e1;color:var(--navy)}button:disabled{opacity:.5;cursor:default}input[type=checkbox]{display:inline;width:auto;margin-right:8px}label{display:block;font-weight:650;margin-top:12px}input,textarea,select{display:block;width:100%;border:1px solid #cfc8bc;border-radius:9px;padding:10px;font:inherit;margin:5px 0}textarea{min-height:125px}.badge{font-size:12px;background:#eee9e1;padding:5px 9px;border-radius:99px}.error{color:#a53d3d;white-space:pre-wrap}iframe{width:100%;height:60vh;border:1px solid var(--line)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.history{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}@media(max-width:760px){.columns{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Fichas da coordenação</h1><p>Avaliação por responsável designado pela Secretaria Geral.</p><a href="/secretaria">Voltar à Secretaria</a></header>
<div class="notice"><strong>Procedimento em preparação.</strong> A operação depende da confirmação do pastor Rubem. Uma ficha em rascunho não representa aprovação ou liberação oficial.</div>
<p id="message" role="status"></p><section id="content"></section></main>
<script>
const PROJECT_URL="https://zrjxxcytgtjuuinhkfux.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_p6zUbFwkzvfv_7XUMqhxwA_BjGCxIEh";
const content=document.getElementById('content'),message=document.getElementById('message');
const S={admin:sessionStorage.getItem('r27a'),session:sessionStorage.getItem('rod27_session'),view:null,mode:sessionStorage.getItem('rod27-special-mode')};
if(!S.mode)S.mode=S.admin?'secretaria':'avaliador';
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={aguardando_designacao:'Aguardando designação',designada:'Designada',em_preenchimento:'Em preenchimento',concluida:'Concluída'};
function error(err){message.className='error';message.textContent=err.message||String(err)}
async function api(action,p={}){
 message.textContent='';
 const headers={'Content-Type':'application/json'};
 if(S.mode==='secretaria'&&S.admin)headers.Authorization='Bearer '+S.admin;else if(S.session)headers['x-rod27-session']=S.session;
 const r=await fetch(PROJECT_URL+'/functions/v1/rod27-special',{method:'POST',headers,body:JSON.stringify({action,...p})});
 const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha na operação.');return j;
}
function loginView(){content.innerHTML='<div class="card"><h2>Acesso do avaliador</h2><p>Use o ROL e o PIN do seu acesso de coordenador. Avaliadores sem acesso digital utilizam o formulário em papel.</p><label>ROL<input id="rol" inputmode="numeric"></label><label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label><button onclick="loginEvaluator()">Entrar como avaliador</button><hr><h2>Secretaria Geral</h2><label>E-mail<input id="email" type="email"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button onclick="loginOffice()">Entrar na Secretaria</button></div>'}
async function loginEvaluator(){try{const r=await fetch(PROJECT_URL+'/functions/v1/rod27-coordinator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',rol:document.getElementById('rol').value,senha:document.getElementById('pin').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);S.admin=null;S.mode='avaliador';sessionStorage.setItem('rod27-special-mode',S.mode);S.session=j.session_token;sessionStorage.setItem('rod27_session',S.session);await list()}catch(err){error(err)}}
async function loginOffice(){try{const r=await fetch(PROJECT_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:PUBLISHABLE_KEY},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const j=await r.json();if(!r.ok)throw new Error('E-mail ou senha inválidos.');S.admin=j.access_token;S.mode='secretaria';sessionStorage.setItem('rod27-special-mode',S.mode);sessionStorage.setItem('r27a',S.admin);sessionStorage.setItem('r27r',j.refresh_token);await list()}catch(err){error(err)}}
async function list(){try{const d=await api('list');content.innerHTML='<div class="actions"><button class="secondary" onclick="changeAccess()">Trocar acesso</button></div>'+(!d.fichas.length?'<div class="card">Nenhuma ficha designada para este acesso.</div>':d.fichas.map(f=>'<article class="card row"><div><h2>'+e(f.nome)+'</h2><div>ROL '+e(f.rol)+' · '+e(f.congregacao)+'</div><p class="muted">'+(f.avaliador_nome?'Avaliador: '+e(f.avaliador_nome)+' · ROL '+e(f.avaliador_rol):'Aguardando responsável autorizado')+'</p><span class="badge">'+labels[f.estado]+'</span></div><button onclick="openFicha(\''+f.id+'\')">Abrir ficha</button></article>').join(''))}catch(err){error(err)}}
function changeAccess(){S.admin=null;S.session=null;S.mode='login';sessionStorage.setItem('rod27-special-mode',S.mode);loginView()}
async function openFicha(id){try{
 const d=await api('detail',{avaliacao_id:id});S.view=d;const f=d.avaliacao,s=d.designacao,active=s&&s.ativa;
 let h='<div class="card"><div class="row"><h2>'+e(f.dirigente_nome_snapshot)+'</h2><button class="secondary" onclick="list()">Voltar às fichas</button></div><p>ROL '+e(f.dirigente_rol)+' · '+e(f.congregacao_nome_snapshot)+'</p><div class="notice">Esta ficha é especial porque o dirigente é o coordenador do setor. Ele não pode registrar sua própria avaliação.</div><span class="badge">'+labels[active?s.estado:'aguardando_designacao']+'</span>';
 if(active)h+='<p><b>Avaliador:</b> '+e(s.avaliador_nome)+' · ROL '+e(s.avaliador_rol)+' · '+e(s.avaliador_funcao)+'</p><p><b>Autorização:</b> '+e(s.autorizacao_referencia)+' · '+e(new Date(s.designado_em).toLocaleString('pt-BR'))+'</p>';
 if(d.can_manage&&!active&&f.status==='nao_iniciada')h+='<h3>Designar avaliador autorizado</h3><label>ROL<input id="assignRol" inputmode="numeric"></label><button class="secondary" onclick="lookupEvaluator()">Conferir nome</button><p id="evaluatorName"></p><label>Função do avaliador<input id="assignRole"></label><label>Referência da autorização da Secretaria<input id="assignAuthorization" placeholder="Documento ou despacho autorizado"></label><label><input type="checkbox" id="confirmAssignment">Confirmo que esta designação corresponde à autorização informada.</label><button onclick="assignEvaluator()">Registrar designação</button>';
 if(!active&&f.status!=='nao_iniciada')h+='<p class="error">Ficha iniciada: a Secretaria precisa revisar a origem anterior antes de designar. O rascunho foi preservado.</p>';
 h+='<div class="actions"><button class="secondary" onclick="printForm()">Imprimir formulário em branco</button>'+(d.can_manage?'<button class="secondary" onclick="history()">Consultar histórico</button>':'')+'</div>';
 if(active&&f.status!=='enviada'){
  const values=new Map(s.respostas_rascunho.map(x=>[x.pergunta_id,x.resposta]));
  h+='<h3>'+(d.can_manage?'Transcrição do formulário assinado':'Preenchimento pelo avaliador designado')+'</h3>';
  if(d.can_manage)h+='<label>Original assinado (PDF, JPG ou PNG; até 8 MB)<input type="file" id="originalFile" accept=".pdf,.jpg,.jpeg,.png"></label><button class="secondary" onclick="uploadOriginal()">Guardar original</button><label>Documento usado na transcrição<select id="documentId"><option value="">Selecione o original</option>'+d.documentos.map(x=>'<option value="'+x.id+'" '+(s.documento_id===x.id?'selected':'')+'>'+e(x.nome)+'</option>').join('')+'</select></label>';
  h+='<div class="columns"><div>'+d.questions.map(q=>'<label for="special_'+q.id+'">'+e(q.ordem)+'. '+e(q.titulo)+(q.obrigatoria?' *':'')+'</label><p class="muted">'+e(q.enunciado)+'</p>'+(q.tipo_resposta==='escolha_unica'?'<select data-question="'+q.id+'"><option value="">Selecione</option>'+(q.opcoes||[]).map(o=>'<option '+(values.get(q.id)===o?'selected':'')+'>'+e(o)+'</option>').join('')+'</select>':'<textarea id="special_'+q.id+'" data-question="'+q.id+'">'+e(values.get(q.id)||'')+'</textarea>')).join('')+'</div><aside><h3>Conferência com o original</h3>'+documentButtons(d)+'<div id="originalPreview"></div></aside></div><label><input type="checkbox" id="confirmSubmission">Conferi as respostas e o original quando houver. O envio será definitivo.</label><div class="actions"><button class="secondary" onclick="save(false)">Salvar rascunho</button><button onclick="save(true)" '+(d.form_status!=='publicado'?'disabled':'')+'>Concluir avaliação</button></div>';
  if(d.form_status!=='publicado')h+='<p class="muted">A conclusão aguarda a publicação oficial das perguntas.</p>';
 }else{h+=documentButtons(d);if(active&&s.estado==='concluida')h+='<p><b>Origem:</b> '+e(s.origem==='papel_secretaria'?'Formulário em papel, transcrito pela Secretaria':'Preenchimento digital pelo avaliador designado')+'<br><b>Registrado por:</b> '+e(s.registrado_nome||'Responsável identificado no histórico')+(s.registrado_rol?' · ROL '+e(s.registrado_rol):'')+' · <b>Registrado em:</b> '+e(new Date(s.registrado_em).toLocaleString('pt-BR'))+'</p>'+s.respostas_rascunho.map(x=>'<div class="card"><b>'+e(d.questions.find(q=>q.id===x.pergunta_id)?.titulo||'Resposta')+'</b><p>'+e(x.resposta)+'</p></div>').join('')}
 content.innerHTML=h+'</div>';
 }catch(err){error(err)}}
function documentButtons(d){return d.documentos.length?d.documentos.map(x=>'<div class="actions"><button class="secondary" onclick="viewOriginal(\''+x.id+'\')">Consultar '+e(x.nome)+'</button></div>').join(''):'<p class="muted">Nenhum original anexado.</p>'}
async function lookupEvaluator(){try{const d=await api('lookup',{rol:document.getElementById('assignRol').value});S.evaluator=d.avaliador;document.getElementById('evaluatorName').textContent=d.avaliador.nome+' · ROL '+d.avaliador.rol}catch(err){S.evaluator=null;error(err)}}
async function assignEvaluator(){try{const rol=document.getElementById('assignRol').value.trim();if(S.evaluator?.rol!==rol)throw new Error('Confira o nome pelo ROL primeiro.');if(!document.getElementById('confirmAssignment').checked)throw new Error('Confirme a correspondência com a autorização informada.');await api('assign',{avaliacao_id:S.view.avaliacao.id,rol,funcao:document.getElementById('assignRole').value,autorizacao:document.getElementById('assignAuthorization').value});await openFicha(S.view.avaliacao.id)}catch(err){error(err)}}
async function save(finalizar){try{if(finalizar&&!document.getElementById('confirmSubmission').checked)throw new Error('Confirme a conferência antes de concluir a avaliação.');const d=S.view;await api('save',{avaliacao_id:d.avaliacao.id,versao:d.designacao.versao,origem:d.can_manage?'papel_secretaria':'avaliador_designado',documento_id:document.getElementById('documentId')?.value||null,finalizar,respostas:Array.from(document.querySelectorAll('[data-question]')).map(x=>({pergunta_id:x.dataset.question,resposta:x.value}))});await openFicha(d.avaliacao.id)}catch(err){error(err)}}
async function uploadOriginal(){try{const file=document.getElementById('originalFile').files[0];if(!file||file.size>8388608)throw new Error('Selecione um original de até 8 MB.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const pending=Array.from(document.querySelectorAll('[data-question]')).map(x=>[x.dataset.question,x.value]);const uploaded=await api('upload',{avaliacao_id:S.view.avaliacao.id,nome:file.name,tipo_mime:file.type,base64});await openFicha(S.view.avaliacao.id);for(const [id,value] of pending){const input=document.querySelector('[data-question="'+id+'"]');if(input)input.value=value}document.getElementById('documentId').value=uploaded.documento_id;message.textContent='Original guardado. Salve a transcrição para registrar as respostas.'}catch(err){error(err)}}
async function viewOriginal(id){try{const d=await api('document_url',{avaliacao_id:S.view.avaliacao.id,documento_id:id});let node=document.getElementById('originalPreview');if(!node){node=document.createElement('div');content.append(node)}node.innerHTML='<iframe title="Documento original" referrerpolicy="no-referrer" src="'+e(d.url)+'"></iframe><a target="_blank" rel="noopener noreferrer" href="'+e(d.url)+'">Abrir original em outra aba</a>'}catch(err){error(err)}}
async function history(){try{const d=await api('history',{avaliacao_id:S.view.avaliacao.id});const node=document.createElement('div');node.className='card history';node.textContent=d.historico.map(x=>new Date(x.criado_em).toLocaleString('pt-BR')+' · '+x.acao+'\n'+JSON.stringify(x.detalhes,null,2)).join('\n\n');content.append(node)}catch(err){error(err)}}
async function printForm(){
 const frame=document.createElement('iframe');frame.title='Formulário para impressão';const preview=document.createElement('div');preview.className='card';preview.append(frame);content.append(preview);const w=frame.contentWindow
 try{const d=await api('blank',{avaliacao_id:S.view.avaliacao.id}),s=d.designacao,f=d.avaliacao;w.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Rod27 · Avaliação especial</title><style>@page{size:A4;margin:16mm}body{font:12px/1.5 Arial;color:#17223b}h1{font-size:21px}section{break-inside:avoid;padding:10px 0}.line{border-bottom:1px solid #aaa;height:28px}.notice{border:2px solid #a53d3d;padding:12px}.signature{margin-top:45px;border-top:1px solid #222;padding-top:5px}@media print{button{display:none}}</style><button onclick="print()">Imprimir / salvar PDF</button><h1>IEADERN · Rodízio 2027</h1><h2>Avaliação do coordenador por avaliador designado</h2>'+(d.form_status!=='publicado'?'<p class="notice">PRÉVIA · PERGUNTAS AINDA NÃO PUBLICADAS</p>':'')+'<p><b>Coordenador avaliado:</b> '+e(f.dirigente_nome_snapshot)+' · ROL '+e(f.dirigente_rol)+'<br><b>Congregação:</b> '+e(f.congregacao_nome_snapshot)+'</p><p><b>Avaliador:</b> '+e(s?.avaliador_nome||'________________________')+' · ROL '+e(s?.avaliador_rol||'________')+'<br><b>Função:</b> '+e(s?.avaliador_funcao||'________________')+'<br><b>Autorização:</b> '+e(s?.autorizacao_referencia||'________________')+'</p>'+d.questions.map(q=>'<section><b>'+e(q.ordem)+'. '+e(q.titulo)+'</b><p>'+e(q.enunciado)+'</p>'+(q.tipo_resposta==='escolha_unica'?(q.opcoes||[]).map(o=>'<p>□ '+e(o)+'</p>').join(''):Array(5).fill('<div class="line"></div>').join(''))+'</section>').join('')+'<p>Data: ____/____/________ · Local: __________________________</p><div class="signature">Assinatura do avaliador designado</div><p>O original assinado será preservado para auditoria. A transcrição identificará o responsável pelo registro.</p></html>');w.document.close()}catch(err){w.document.body.textContent=err.message;error(err)}
}
if(S.mode==='secretaria'&&S.admin||S.mode==='avaliador'&&S.session)list();else loginView();
</script></body></html>
